# RSVP Content-Security-Policy, staging. Provisioner-owned: infra/cloud-init.sh
# installs this file as /etc/nginx/snippets/rsvp-staging-csp.conf, which the RSVP
# server block includes. Change it here and converge; a hand edit on the instance
# shows as DRIFT and the next converge overwrites it.
#
# Source: the pre-cutover staging policy (legacy rsvp/security.conf, lines
# 18-30). frame-ancestors is 'self' only: no outside site frames RSVP pages.

set $default_src "default-src 'self';";
set $script_src "script-src 'self' 'unsafe-inline' https://stg.rsvp.amazonmgmstudiosawards.com https://ajax.googleapis.com https://addtocalendar.com;";
set $style_src "style-src 'self' 'unsafe-inline' https://rsvp.amazonmgmstudiosawards.com https://stg.rsvp.amazonmgmstudiosawards.com;";
set $font_src "font-src * 'self' data: blob:;";
set $img_src "img-src 'self' data:;";
set $frame_src "frame-src 'self' https://www.consideramazon.com https://*.consideramazon.com";
set $frame_ancestors "frame-ancestors 'self'";
set $connect_src "connect-src 'self' https://stg.rsvp.amazonmgmstudiosawards.com https://nominatim.openstreetmap.org https://secure.geonames.org;";
set $base_uri "base-uri 'self';";
set $form_action "form-action 'self' https://stg.rsvp.amazonmgmstudiosawards.com;";

add_header Content-Security-Policy "${default_src}; ${script_src}; ${style_src}; ${font_src}; ${img_src}; ${frame_src}; ${frame_ancestors}; ${connect_src}; ${base_uri}; ${form_action};" always;
