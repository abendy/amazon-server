user nginx;

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  types_hash_bucket_size 1024;
  types_hash_max_size 4096;
  include mime.types;
  default_type application/octet-stream;
  disable_symlinks off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;
  absolute_redirect on;
  port_in_redirect on;

  keepalive_timeout 65;
  # Trailer uploads: idle allowance between body reads on a slow link.
  client_body_timeout 300;
  client_header_timeout 30;
  send_timeout 30;
  client_max_body_size 600m;
  client_body_buffer_size 600m;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  log_format scripts '$request $status > $document_root$fastcgi_script_name ? $query_string';

  # An unidentified client on EC2 replays dead title pages around the clock,
  # and each page pulls the full key-art set. No current browser sends this
  # Chrome version; includes/security.conf refuses it.
  map $http_user_agent $blocked_agent {
    default 0;
    "~Chrome/51\.0\.2704\.103" 1;
  }

  map $request_uri $rsvp_cors_origin {
    default "*";
    ~^/admin/api/v1(?:/|$) "";
  }

  map $request_uri $rsvp_cors_methods {
    default "POST, GET, OPTIONS";
    ~^/admin/api/v1(?:/|$) "";
  }

  map $request_uri $rsvp_cors_headers {
    default "Content-Type";
    ~^/admin/api/v1(?:/|$) "";
  }

  # The local default is open. R4 changes only this default to "Staging" and
  # provisions the referenced .htpasswd file for the staging embed path.
  map $http_origin $rsvp_auth {
    default off;
    "~*^https?://([^/]+\.)?consideramazon\.com$" off;
    "~*^https?://consideramazon\.dmlib\.pro$" off;
  }

  # RSVP booking throttle. Every CodeIgniter URL that reaches a public booking
  # handler counts: the API route, its direct controller path, the legacy
  # register route, and each with index.php. CodeIgniter also routes a bare
  # /admin/ or /admin/index.php by a query string that starts with "/"
  # (/admin/?/api/v1/rsvp), so every such POST counts too. Other requests get
  # an empty key, which limit_req ignores.
  map "$request_method $uri ?$args" $rsvp_booking_route {
    default 0;
    "~*^POST /admin/(?:index\.php/)?(?:api/v1/rsvp|api/rsvp|attendees/register)(?:/.*)? \?" 1;
    "~*^POST /admin(?:/index\.php)?/* \?/" 1;
  }

  # The viewer is $remote_addr. In the RSVP server block,
  # includes/cloudfront-real-ip.conf sets it from X-Forwarded-For only when
  # CloudFront made the connection, so a request sent straight to the origin
  # keeps its own address. The peer zone keys on the connecting address itself.
  map $rsvp_booking_route $rsvp_booking_viewer_key {
    default "";
    1 $remote_addr;
  }

  map $rsvp_booking_route $rsvp_booking_peer_key {
    default "";
    1 $realip_remote_addr;
  }

  # Flood guard only: an invite blast can send dozens of real bookings from
  # one office address. The peer zone is wider because CDN edges carry many
  # viewers per address. Finer per-booking checks live in the RSVP app.
  limit_req_zone $rsvp_booking_viewer_key zone=rsvp_booking_viewer:10m rate=30r/m;
  limit_req_zone $rsvp_booking_peer_key zone=rsvp_booking_peer:10m rate=300r/m;

  include includes/gzip.conf;

  ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  include server_blocks/*.conf;
}
