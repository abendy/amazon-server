user nginx;

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  types_hash_bucket_size 1024;
  types_hash_max_size 4096;
  include mime.types;
  default_type application/octet-stream;
  disable_symlinks off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;
  absolute_redirect on;
  port_in_redirect on;

  keepalive_timeout 65;
  # Trailer uploads: idle allowance between body reads on a slow link.
  client_body_timeout 300;
  client_header_timeout 30;
  send_timeout 30;
  client_max_body_size 600m;
  client_body_buffer_size 600m;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  log_format scripts '$request $status > $document_root$fastcgi_script_name ? $query_string';

  map $request_uri $rsvp_cors_origin {
    default "*";
    ~^/admin/api/v1(?:/|$) "";
  }

  map $request_uri $rsvp_cors_methods {
    default "POST, GET, OPTIONS";
    ~^/admin/api/v1(?:/|$) "";
  }

  map $request_uri $rsvp_cors_headers {
    default "Content-Type";
    ~^/admin/api/v1(?:/|$) "";
  }

  # The local default is open. R4 changes only this default to "Staging" and
  # provisions the referenced .htpasswd file for the staging embed path.
  map $http_origin $rsvp_auth {
    default off;
    "~*^https?://([^/]+\.)?consideramazon\.com$" off;
    "~*^https?://consideramazon\.dmlib\.pro$" off;
  }

  # RSVP booking throttle. Every CodeIgniter URL that reaches a public booking
  # handler counts: the API route, its direct controller path, the legacy
  # register route, and each with index.php. Other requests get an empty key,
  # which limit_req ignores.
  map "$request_method $uri" $rsvp_booking_route {
    default 0;
    "~*^POST /admin/(?:index\.php/)?(?:api/v1/rsvp|api/rsvp|attendees/register)(?:/.*)?$" 1;
  }

  # The CDN appends the viewer's address as the last X-Forwarded-For entry.
  # A client that reaches the origin directly can forge that header, so the
  # peer zone also limits the connecting address.
  map $http_x_forwarded_for $rsvp_viewer_addr {
    default $remote_addr;
    "~(?<rsvp_forwarded_last>[^,\s]+)\s*$" $rsvp_forwarded_last;
  }

  map $rsvp_booking_route $rsvp_booking_viewer_key {
    default "";
    1 $rsvp_viewer_addr;
  }

  map $rsvp_booking_route $rsvp_booking_peer_key {
    default "";
    1 $binary_remote_addr;
  }

  # Starting values. The viewer zone tolerates a shared office network; the
  # peer zone is wide because CDN edges carry many viewers per address.
  limit_req_zone $rsvp_booking_viewer_key zone=rsvp_booking_viewer:10m rate=12r/m;
  limit_req_zone $rsvp_booking_peer_key zone=rsvp_booking_peer:10m rate=120r/m;

  include includes/gzip.conf;

  ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  include server_blocks/*.conf;
}
