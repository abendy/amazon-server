server {
  listen 80;
  listen [::]:80;
  # ENV DELTA: staging/prod replace the local name and add TLS listeners.
  server_name guilds.local;

  root /var/www/html/amazon-studios-guilds/web;
  index index.php;
  rewrite_log on;

  # Local validation placeholder. RS-06 supplies the WordPress FPM pool.
  set $wordpress_fpm 127.0.0.1:9072;
  set $site_frame_options "SAMEORIGIN";
  set $site_asset_expires 1y;
  set $site_asset_cache_control "";
  set $site_css_expires 1y;
  set $site_css_cache_control "";
  set $site_css_pragma "";

  access_log /var/log/nginx/guilds-access.log main;
  access_log /var/log/nginx/guilds-scripts.log scripts;
  error_log /var/log/nginx/guilds-error.log debug;

  include includes/security.conf;
  include includes/static.conf;
  include includes/wordpress.conf;
}
