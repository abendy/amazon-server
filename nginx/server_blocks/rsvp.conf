upstream rsvp_fpm {
  server fpm:9000;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  # ENV DELTA: staging/prod replace the local names and add TLS listeners.
  server_name localhost 127.0.0.1 rsvp.local rsvp.dev.amazonmgmstudiosawards.com;

  root /var/www/html;
  index index.php;
  rewrite_log on;

  set $site_frame_options "";
  set $site_asset_expires 1h;
  set $site_asset_cache_control "public, must-revalidate";
  set $site_css_expires -1;
  set $site_css_cache_control "no-store, no-cache, must-revalidate";
  set $site_css_pragma "";
  set $rsvp_http_ci_env local;

  access_log /var/log/nginx/rsvp-access.log main;
  access_log /var/log/nginx/rsvp-scripts.log scripts;
  error_log /var/log/nginx/rsvp-error.log warn;

  add_header Access-Control-Allow-Origin $rsvp_cors_origin always;
  add_header Access-Control-Allow-Methods $rsvp_cors_methods always;
  add_header Access-Control-Allow-Headers $rsvp_cors_headers always;

  if ($host ~* ^www\.(?<rsvp_bare_host>.+)$) {
    return 301 https://$rsvp_bare_host$request_uri;
  }

  include includes/security.conf;
  include includes/static.conf;

  # Booking throttle; the zones and route match live in nginx.conf.
  limit_req zone=rsvp_booking_viewer burst=24 nodelay;
  limit_req zone=rsvp_booking_peer burst=120 nodelay;
  limit_req_status 429;
  limit_req_log_level warn;
  error_page 429 = @rsvp_booking_throttled;

  # Same envelope as the API's errors so clients show their failure state.
  # The body is static and carries no credentials, so any origin may read it.
  location @rsvp_booking_throttled {
    default_type application/json;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Retry-After 60 always;
    return 429 '{"success":false,"code":"RATE_LIMITED","message_text":"Too many requests. Please wait a minute and try again.","field_errors":{}}';
  }

  # ENV DELTA: staging and production keep server tokens disabled; local parity
  # matches the RS-04 nginx 1.27 harness response body.
  server_tokens on;

  location = /rsvp/consideramazon {
    add_header Access-Control-Allow-Origin $rsvp_cors_origin always;
    add_header Access-Control-Allow-Methods $rsvp_cors_methods always;
    add_header Access-Control-Allow-Headers $rsvp_cors_headers always;
    return 301 $scheme://$http_host/rsvp/consideramazon/;
  }

  location ^~ /rsvp/consideramazon/ {
    alias /var/www/html/public/consideramazon/;
    index index.html;

    access_log /var/log/nginx/rsvp-embed-access.log combined;

    auth_basic $rsvp_auth;
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ENV DELTA: staging/prod add the deployed embed CORS, OPTIONS, and no-cache
    # directives here. Local inherits the RS-04 server-level CORS headers.
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.php?$query_string;
  }

  location ~ \.php$ {
    try_files $uri =404;

    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass rsvp_fpm;
    fastcgi_index index.php;

    include includes/fastcgi.conf;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTP_CI_ENV $rsvp_http_ci_env;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 300;
  }

  location / {
    root /var/www/html/public;
    try_files $uri $uri/ =404;
  }
}
