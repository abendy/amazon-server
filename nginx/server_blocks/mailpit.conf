# Local only: the Mailpit mail catcher's web page, from the local Docker stack. The upstream
# resolves per request through Docker's DNS, so nginx -t passes where no mailpit host exists;
# on a provisioned instance these names have no DNS record and the block serves nothing.
server {
  listen 80;
  listen [::]:80;
  server_name mailpit.local mailpit.dev.amazonmgmstudiosawards.com;

  resolver 127.0.0.11 ipv6=off valid=30s;
  set $mailpit_ui mailpit:8025;

  access_log /var/log/nginx/mailpit-access.log main;
  error_log /var/log/nginx/mailpit-error.log warn;

  location / {
    proxy_pass http://$mailpit_ui;
    proxy_http_version 1.1;
    # Mailpit's live view is a WebSocket.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep an idle live view open.
    proxy_read_timeout 1h;
  }
}
