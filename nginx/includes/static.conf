# App metadata and data should not be cached.
location ~* ^/(?!admin/).+\.(?:manifest|appcache|html?|xml|json)$ {
  expires 0;
}

location ~* ^/(?!admin/).+\.(?:rss|atom)$ {
  add_header Cache-Control "public, must-revalidate";
  expires 1h;
}

location ~* ^/(?!admin/).+\.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|mp4|ogg|ogv|webm|htc)$ {
  add_header Access-Control-Allow-Origin *;
  add_header Cache-Control $site_asset_cache_control always;
  expires $site_asset_expires;
  access_log off;
}

location ~* ^/(?!admin/).+\.svgz$ {
  add_header Cache-Control $site_asset_cache_control always;
  expires $site_asset_expires;
  access_log off;
  gzip off;
}

# RSVP's legacy style and script paths retain their no-cache behavior.
location ~* ^/rsvp/(?:css|js)/.+\.(?:css|js)$ {
  add_header Access-Control-Allow-Origin "*" always;
  add_header Cache-Control $site_css_cache_control always;
  expires $site_css_expires;
  add_header Pragma $site_css_pragma always;
  rewrite ^/rsvp/(.+)?$ /$1 break;
}

location ~* ^/(?!admin/).+\.(?:css|htc|less|js|js2|js3|js4)$ {
  expires $site_css_expires;
  add_header Cache-Control $site_css_cache_control always;
  add_header Pragma $site_css_pragma always;
  etag on;
  if_modified_since exact;
  try_files $uri $uri/ /index.php?$args;
  access_log off;
}

location ~* ^/(?!admin/).+\.(?:ttf|ttc|otf|eot|woff|woff2)$ {
  add_header Access-Control-Allow-Origin *;
  add_header Cache-Control $site_asset_cache_control always;
  expires $site_asset_expires;
  access_log off;
}

location ~* ^/(?!admin/).+\.(?:pdf|doc|xls)$ {
  add_header Access-Control-Allow-Origin *;
}

location = /robots.txt {
  access_log off;
  log_not_found off;
}

location = /favicon.ico {
  log_not_found off;
  access_log off;
}

# W3 Total Cache rules retained from the deployed WordPress includes. The
# earlier extension rules intentionally win for overlapping extensions.
location ~* ^/(?!admin/).+\.(?:html|htm|rtf|rtx|txt|xsd|xsl|xml)$ {
  etag on;
  if_modified_since exact;
  try_files $uri $uri/ /index.php?$args;
}

location ~* ^/(?!admin/).+\.(?:asf|asx|wax|wmv|wmx|avi|avif|avifs|bmp|class|divx|doc|docx|exe|gif|gz|gzip|ico|jpg|jpeg|jpe|webp|json|mdb|mid|midi|mov|qt|mp3|m4a|mp4|m4v|mpeg|mpg|mpe|webm|mpp|_otf|odb|odc|odf|odg|odp|ods|odt|ogg|ogv|pdf|png|pot|pps|ppt|pptx|ra|ram|svg|svgz|swf|tar|tif|tiff|_ttf|wav|wma|wri|xla|xls|xlsx|xlt|xlw|zip)$ {
  expires $site_asset_expires;
  etag on;
  if_modified_since exact;
  try_files $uri $uri/ /index.php?$args;
}
