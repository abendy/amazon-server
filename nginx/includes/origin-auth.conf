# Origin lockdown, repo default: refuse nothing. On a host with
# /etc/amazon-server.origin-auth, converge replaces this file with one that
# refuses any request without CloudFront's X-Origin-Auth secret
# (infra/origin-auth.sh; infra/README.md, "Origin lockdown").
map $http_x_origin_auth $origin_refused {
  default 0;
}
