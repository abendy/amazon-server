location / {
  try_files $uri $uri/ /index.php?$args;
}

# XML-RPC: nothing uses it, and it draws most of the password guessing
# (abendy/amazon-docs#428). Exact matches win over the PHP regex below, and
# merge_slashes folds //wp//xmlrpc.php into /wp/xmlrpc.php.
location = /wp/xmlrpc.php {
  return 403;
}

location = /xmlrpc.php {
  return 403;
}

location ~ \.php$ {
  try_files $uri =404;

  fastcgi_split_path_info ^(.+\.php)(/.+)$;
  fastcgi_pass $wordpress_fpm;
  fastcgi_index index.php;

  include includes/fastcgi.conf;
  fastcgi_param PATH_INFO $fastcgi_path_info;

  fastcgi_buffers 16 16k;
  fastcgi_buffer_size 32k;
  # Matches the pool max_execution_time for large media handling.
  fastcgi_read_timeout 600;
}
