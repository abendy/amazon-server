add_header X-Content-Type-Options "nosniff" always;
add_header X-Xss-Protection "1; mode=block" always;
add_header X-Frame-Options $site_frame_options always;

# Keep hidden files, application internals, and upload scripts out of every site.
location ~ (^|/)\.
{
  deny all;
}

location ~ ^/(?:admin/)?(?:application|cache|system|tests|vendor|config|logs|backup)(?:/|$) {
  deny all;
}

location ~* /(?:uploads|files)/.*\.php$ {
  deny all;
}
