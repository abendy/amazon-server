# Encode review, staging only. infra/encode-review.sh installs this file as
# /etc/nginx/snippets/encode-review.conf; the staging WordPress server blocks
# include it. Production renders nothing.
#
# Uploads need nothing here: they arrive in 64 MiB parts through the site's
# normal admin-post.php, inside its own limits (nginx 600m, PHP 512M).

# Playback. The admin page checks the WordPress login, then answers with
# X-Accel-Redirect: /_encode-review/<state>/<job>/<file>. nginx serves that
# spool file itself, with range requests, so seeking works and PHP never
# streams video. The location is internal: no browser can request it.
location ^~ /_encode-review/ {
  internal;
  alias /srv/encode-review/;
}
